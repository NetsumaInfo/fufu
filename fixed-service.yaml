apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fulguria-team
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/fufu-482308/fulguria-team
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: NEXT_PUBLIC_CDN_URL
          value: https://storage.googleapis.com/fulguria-assets
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: youtube-api-key
        - name: YOUTUBE_CHANNEL_ID
          valueFrom:
            secretKeyRef:
              key: latest
              name: youtube-channel-id
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
  traffic:
  - percent: 100
    latestRevision: true
